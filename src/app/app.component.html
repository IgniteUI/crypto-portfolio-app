<div class="main" igxLayout>
  <igx-nav-drawer #nav id="project-menu" [enableGestures]="true" width="280px" [pin]="false" [pinThreshold]="5000">
    <ng-template igxDrawer>
      <span igxDrawerItem [isHeader]="true">Menu</span>
      @for (route of topNavLinks; track route.path) {
        <a igxDrawerItem igxRipple [routerLink]="route.path" routerLinkActive
          #activeRoute="routerLinkActive" [active]="activeRoute.isActive">
          @if (route.subItem) {
            <span>&nbsp;&nbsp;&nbsp;&nbsp;</span>
          }
          <igx-icon family="material" aria-hidden="true">{{route.icon}}</igx-icon>
          <span>{{route.name}}</span>
        </a>
      }
    </ng-template>
  </igx-nav-drawer>
  <div igxFlex>
    <igx-navbar title="Crypto Portfolio App" actionButtonIcon="menu" (action)="nav.toggle()" igxFlex>
        <div class="theme-chooser">
            <button type="button"
              [class.theme-chooser__item--light]="darkTheme()"
              [class.theme-chooser__item--dark]="!darkTheme()"
              [attr.aria-label]="darkTheme() ? 'Switch to light theme' : 'Switch to dark theme'"
              [attr.aria-pressed]="darkTheme()"
              [title]="darkTheme() ? 'Light Theme' : 'Dark Theme'"
              (click)="changeTheme()">
            </button>
          </div>
      <span>
        @if (user()) {
          <div class="account-container">
            @if (innerWidth() > 650) {
              <span>{{ name() ? 'Hi ' + name() : '' }}</span>
            }
            <button type="button" igxButton="contained" igxRipple (click)="logout()">Logout</button>
          </div>
        } @else {
          <div><button type="button" igxButton="contained" igxRipple (click)="login()">Login</button></div>
        }
      </span>
    </igx-navbar>
    <div class="content" igxLayout igxLayoutJustify="center">
      <router-outlet></router-outlet>
    </div>
  </div>
</div>
