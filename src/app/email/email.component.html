<div class="form-container">
   <div>
      <igx-icon id="lockIcon">email</igx-icon>
      <form [formGroup]="form" (ngSubmit)="onSubmit()">
         <igx-input-group type="line">
            <label igxLabel for="email">Email address</label>
            <input id="email" igxInput formControlName="email" type="email" autocomplete="email" required />
            <igx-suffix>
               <igx-icon>email</igx-icon>
            </igx-suffix>
         </igx-input-group>
         <igx-input-group type="line">
            <label igxLabel for="password">Password</label>
            <input id="password" igxInput formControlName="password" type="password" autocomplete="current-password" required />
            <igx-suffix>
               <igx-icon>lock</igx-icon>
            </igx-suffix>
         </igx-input-group>

         <div class="signup-form-actions">
            <a igxButton="flat" igxRipple routerLink="/login" id="goback">Go back</a>
            <button id="loginBtn" igxButton="contained" igxRipple type="submit" [disabled]="form.invalid"
               class="basic-btn">Log in</button>
         </div>
         <div class="sbPosition">
            <igx-snackbar #snack [autoHide]="true"></igx-snackbar>
         </div>
      </form>
      <a routerLink="/signup" class="alc">Don't have an account?</a>
   </div>
</div>
