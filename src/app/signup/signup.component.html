<div class="form-container">
  <div>
    <igx-icon id="lockIcon" name="person"></igx-icon>
    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <igx-input-group type="line">
        <label igxLabel for="email">Email address</label>
        <input id="email" igxInput formControlName="email" type="email" autocomplete="email" required />
        <igx-suffix>
          <igx-icon name="email"></igx-icon>
        </igx-suffix>
      </igx-input-group>
      <igx-input-group type="line">
        <label igxLabel for="password">Password</label>
        <input id="password" igxInput formControlName="password" type="password" autocomplete="new-password" required />
        <igx-suffix>
          <igx-icon name="lock"></igx-icon>
        </igx-suffix>
      </igx-input-group>

      <div class="signup-form-actions">
        <a igxButton="flat" igxRipple routerLink="/login" id="goback">Go back</a>
        <button igxButton="contained" igxRipple type="submit" [disabled]="form.invalid" class="basic-btn">Create my account</button>
      </div>

      <div class="sbPosition">
          <igx-snackbar #snack [autoHide]="true"></igx-snackbar>
      </div>
    </form>
  </div>
</div>
