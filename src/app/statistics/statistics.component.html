<div class="sample-wrapper">
  <div class="chart-wrapper">
    <span class="content-span">
      <igx-combo
        #combo
        [itemsMaxHeight]="255"
        [data]="coins()"
        displayKey="name"
        valueKey="symbol"
        placeholder="Cryptocurrencies"
        searchPlaceholder="Search cryptocurrencies"
        aria-label="Cryptocurrencies shown on the chart"
        (selectionChanging)="onSelectionChanging($event)"
      ></igx-combo>
    </span>

    <igx-financial-chart
      [dataSource]="data()"
      [isToolbarVisible]="true"
      [crosshairsAnnotationEnabled]="true"
      height="100%"
      width="100%"
      class="financial-chart"
      crosshairsDisplayMode="Both"
      chartType="Candle"
      trendLineType="ExponentialFit"
      indicatorTypes="StochRSI"
      overlayTypes="PriceChannel"
      [finalValueAnnotationsVisible]="true"
      aria-label="Historical cryptocurrency price chart"
    ></igx-financial-chart>
  </div>
</div>
